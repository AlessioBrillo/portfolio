<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    The Ascent — social card source (1200x630, 1.91:1).

    Regenerate public/og-image.png with:

      npm run og

    The script inlines the committed /fonts binaries as data URLs, then
    screenshots this SVG with Playwright chromium — no relative font paths,
    no deleted typefaces, no one-shot /tmp procedure.

    Design tokens mirror src/styles/tokens.css: paper #f4f4f0, night #0a0a0a,
    ink #050505, ink-soft #48453f, phosphor #eaeaea, accent #e61919.
  -->
  <defs>
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../../public/fonts/Archivo.woff2') format('woff2');
        font-weight: 400 900;
      }
      @font-face {
        font-family: 'Archivo Black';
        src: url('../../public/fonts/ArchivoBlack.woff2') format('woff2');
        font-weight: 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../public/fonts/JetBrainsMono.woff2') format('woff2');
        font-weight: 400 800;
      }
    </style>
  </defs>

  <!-- Daylight ground -->
  <rect width="1200" height="630" fill="#f4f4f0" />

  <!-- Night cruise, rising edge (50px over 1200px) -->
  <path d="M0 352 L1200 302 L1200 0 L0 0 Z" fill="#0a0a0a" />

  <!-- Eyebrow -->
  <text x="96" y="110" font-family="JetBrains Mono" font-size="22" font-weight="500"
        letter-spacing="6" fill="#e61919">PORTFOLIO — THE ASCENT</text>

  <!-- Title -->
  <text x="96" y="215" font-family="Archivo Black" font-size="82" font-weight="900"
        letter-spacing="-4" fill="#eaeaea">THE ASCENT</text>

  <!-- Author -->
  <text x="96" y="285" font-family="JetBrains Mono" font-size="28" font-weight="500"
        letter-spacing="4" fill="#eaeaea">ALESSIO BRILLO</text>

  <!-- The climb, apex kissing the night edge -->
  <path d="M140 560 L300 352 L460 560" fill="none" stroke="#e61919" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tagline -->
  <text x="540" y="470" font-family="Archivo" font-size="26" font-weight="400" fill="#48453f">
    Student of AI and physics
  </text>
  <text x="540" y="515" font-family="Archivo" font-size="26" font-weight="400" fill="#48453f">
    building, flying, learning.
  </text>
</svg>
