name: Domain Dry-Run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  domain-dry-run:
    name: Domain Mode Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SITE_URL: https://example.com
      VITE_PLAUSIBLE_SRC: https://plausible.io/js/script.js
      VITE_PLAUSIBLE_DOMAIN: example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (domain mode)
        run: npm run build

      - name: Bundle size check
        run: npm run bundle:check:ci

      - name: Validate site URL
        run: node scripts/validate-site-url.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Finalize dist
        run: node scripts/finalize-dist.mjs

      - name: Deploy routing check
        run: npm run deploy:check