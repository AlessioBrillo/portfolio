name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'public/**'
              - '*.ts'
              - '*.tsx'
              - '*.css'
              - '*.html'
              - '*.json'
              - 'vercel.json'
              - '.github/**'
              - '!docs/**'
              - '!*.md'

  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Audit dependencies (fail on high/critical advisories)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (with the 100% coverage floor from vitest.config.ts, enforced pre-merge)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Enforce bundle budget (ADR-0018)
        run: npm run bundle:check

      - name: Enforce the SPA-fallback routing contract (vercel.json vs public/)
        run: npm run deploy:check

      - name: Enforce the photo-asset contract (referenced files exist, no orphans)
        run: npm run photos:check