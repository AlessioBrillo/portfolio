name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Audit dependencies (fail on high/critical advisories)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (with the 100% coverage floor from vitest.config.ts, enforced pre-merge)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Enforce bundle budget (ADR-0018)
        run: npm run bundle:check -- --fail-on-increase

      - name: Enforce the SPA-fallback routing contract (vercel.json vs public/)
        run: npm run deploy:check

      - name: Enforce the photo-asset contract (referenced files exist, no orphans)
        run: npm run photos:check