name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_FILE: '.nvmrc'

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck, Test, Bundle & Deploy Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run bundle:check:ci

      - name: Photo asset contract
        run: npm run photos:check

      - name: Deploy routing check
        run: npm run deploy:check

  domain-dry-run:
    name: Domain Mode Build & Artifact Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SITE_URL: https://example.com
      VITE_PLAUSIBLE_SRC: https://plausible.io/js/script.js
      VITE_PLAUSIBLE_DOMAIN: example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (domain mode)
        run: npm run build

      - name: Bundle size check
        run: npm run bundle:check:ci

      - name: Validate site URL
        run: node scripts/validate-site-url.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Finalize dist
        run: node scripts/finalize-dist.mjs

      - name: Deploy routing check
        run: npm run deploy:check

      - name: Verify sitemap has 7 URLs (/, /archive, 5 case studies)
        run: |
          count=$(grep -c '<url>' dist/sitemap.xml)
          echo "Sitemap URL count: $count"
          if [ "$count" -ne 7 ]; then
            echo "ERROR: Expected 7 URLs in sitemap, got $count"
            cat dist/sitemap.xml
            exit 1
          fi

      - name: Verify absolute og:image in dist/index.html
        run: |
          if ! grep -q 'https://example.com/og-image.png' dist/index.html; then
            echo "ERROR: Absolute og:image not found in dist/index.html"
            grep -i 'og:image' dist/index.html || echo "No og:image found"
            exit 1
          fi
          echo "Absolute og:image verified"

      - name: Verify JSON-LD url in dist/index.html
        run: |
          if ! grep -q '"url": "https://example.com/"' dist/index.html; then
            echo "ERROR: JSON-LD url not found in dist/index.html"
            grep -i 'json-ld\|@type' dist/index.html -A 10 || echo "No JSON-LD found"
            exit 1
          fi
          echo "JSON-LD url verified"

      - name: Verify robots.txt Sitemap line
        run: |
          if ! grep -q 'Sitemap: https://example.com/sitemap.xml' dist/robots.txt; then
            echo "ERROR: Sitemap line not found in dist/robots.txt"
            cat dist/robots.txt
            exit 1
          fi
          echo "robots.txt Sitemap line verified"

  # Vercel builds and deploys through its Git integration (ADR-0027); this
  # pipeline is the gate. The signature harness runs against both servers:
  # the dev server and the production build served by `vite preview`.
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            command: npm run e2e
          - name: preview
            command: npm run e2e:preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the E2E harness
        run: ${{ matrix.command }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
