name: E2E signature

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tonal: ${{ steps.filter.outputs.tonal }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect tonal-surface changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            tonal:
              - 'src/components/ascent/**'
              - 'src/components/navigation/**'
              - 'src/components/ui/**'
              - 'src/pages/**'
              - 'src/content/**'
              - 'src/router.tsx'
              - 'src/hooks/useScrollProgress.ts'
              - 'src/hooks/useCurrentSection.ts'
              - 'src/hooks/useAltitudeProfile.ts'
              - 'src/hooks/useDocumentMeta.ts'
              - 'src/lib/tone.ts'
              - 'src/lib/section-tone.ts'
              - 'src/lib/altitude.ts'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'playwright.config.preview.ts'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: filter
    if: always() && (needs.filter.outputs.tonal == 'true' || github.event_name == 'workflow_dispatch' || needs.filter.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            command: npm run e2e
          - name: preview
            command: npm run e2e:preview

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the tonal signature harness
        run: ${{ matrix.command }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7