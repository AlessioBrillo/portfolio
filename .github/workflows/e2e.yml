name: E2E signature

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ascent/**'
      - 'src/components/navigation/**'
      - 'src/components/ui/**'
      - 'src/pages/**'
      - 'src/content/**'
      - 'src/router.tsx'
      - 'src/hooks/useScrollProgress.ts'
      - 'src/hooks/useCurrentSection.ts'
      - 'src/hooks/useAltitudeProfile.ts'
      - 'src/hooks/useDocumentMeta.ts'
      - 'src/lib/tone.ts'
      - 'src/lib/altitude.ts'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/ascent/**'
      - 'src/components/navigation/**'
      - 'src/components/ui/**'
      - 'src/pages/**'
      - 'src/content/**'
      - 'src/router.tsx'
      - 'src/hooks/useScrollProgress.ts'
      - 'src/hooks/useCurrentSection.ts'
      - 'src/hooks/useAltitudeProfile.ts'
      - 'src/hooks/useDocumentMeta.ts'
      - 'src/lib/tone.ts'
      - 'src/lib/altitude.ts'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the tonal signature harness
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
