test:
  - changed-files:
      - any-glob-to-any-file:
          - src/**/*.test.{ts,tsx}
          - vitest.config.ts
          - src/test-setup.ts

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - '*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
          - .github/dependabot.yml

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*

styles:
  - changed-files:
      - any-glob-to-any-file:
          - src/**/*.css

types:
  - changed-files:
      - any-glob-to-any-file:
          - src/types/**/*
          - tsconfig.json
