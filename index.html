<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Student of AI and physics — building, flying, learning." />
    <title>The Ascent — Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Social cards (og:image must be absolute at deploy; the relative path keeps
      the interim deployment truthful). The card source is
      docs/design/og-image.svg — see its header for regeneration.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Ascent — Alessio Brillo" />
    <meta
      property="og:description"
      content="Student of AI and physics — building, flying, learning."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f4efe6" />
    <!--
      Person structured data for search engines. `url` is omitted until the
      real domain is configured (ADR-0008 / deploy step); `sameAs` mirrors
      src/lib/site.ts and is the single exception to its data ownership.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alessio Brillo",
        "jobTitle": "Student of AI and physics",
        "description": "Student of AI and physics — building, flying, learning.",
        "sameAs": ["https://www.linkedin.com/in/alessio-brillo", "https://github.com/AlessioBrillo"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
